name: Build APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug & release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.NC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NC_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No release keystore configured – release APK will be signed with the debug key."
          fi

      - name: Build
        env:
          NC_KEYSTORE_PASSWORD: ${{ secrets.NC_KEYSTORE_PASSWORD }}
          NC_KEY_ALIAS: ${{ secrets.NC_KEY_ALIAS }}
          NC_KEY_PASSWORD: ${{ secrets.NC_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/NothingCall-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "dist/NothingCall-${VERSION}-release.apk"
          git archive --format=zip --prefix="NothingCall-Privacy-${VERSION}/" -o "dist/NothingCall-Privacy-${VERSION}-source.zip" HEAD
          ls -la dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NothingCall-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NothingCall-source
          path: dist/*.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
